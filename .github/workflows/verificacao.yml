# Verificacao automatica de todo PR e de todo push na main.
#
# A producao sai da main pela Vercel, sem nenhuma checagem no caminho: um
# erro de tipagem ou um build quebrado so aparecia quando o deploy falhava
# — ou pior, quando passava e quebrava uma tela. Aqui roda o mesmo que o
# CLAUDE.md pede antes de toda entrega, so que sem depender de lembrar.
name: Verificacao

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verificacao-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Tipagem
        run: npx tsc --noEmit

      - name: Acentos no texto que a pessoa le
        run: python3 scripts/acentos.py app components lib --checar

      # Sem as chaves de producao: o build nao pode depender delas (o
      # sitemap ja cai no plano B sem banco). Se um dia depender, e aqui
      # que aparece — antes do deploy.
      #
      # O Supabase aponta para um endereco falso. Nao e segredo nem banco
      # de verdade: e so para o navegador dos testes abaixo ter um cliente
      # de login, que eles respondem com uma sessao de mentira.
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: http://sb.local
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: fake

      # Testes de ponta a ponta: abrem as telas num Chromium de verdade,
      # no computador e no celular, com as APIs simuladas (e2e/).
      - name: Navegador dos testes
        run: npx playwright install --with-deps chromium

      - name: Testes de ponta a ponta
        run: npm run e2e
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # Quando falha, o relatorio traz print e o
      # trace (passo a passo) de cada teste — baixe em "Artifacts" na pagina do job.
      - name: Relatorio dos testes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-e2e
          path: |
            playwright-report
            test-results
          retention-days: 7
